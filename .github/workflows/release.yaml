name: 发布

on:
  push:
    tags:
      - "v*-mumu.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建发布归档
        run: bash scripts/build.sh release

      - name: 生成构建元数据
        id: metadata
        shell: bash
        run: |
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送生产镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.build
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
            mumu-140/octopus-concurrency:${{ steps.metadata.outputs.version }}
          build-args: |
            GIT_VERSION=${{ steps.metadata.outputs.version }}
            COMMIT_ID=${{ steps.metadata.outputs.commit }}
            SOURCE_REVISION=${{ steps.metadata.outputs.revision }}
            SOURCE_TREE=${{ steps.metadata.outputs.tree }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            GIT_AUTHOR=mumu-140
            SOURCE_URL=https://github.com/${{ github.repository }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          files: build/archives/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
