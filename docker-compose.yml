name: octopus-dev

services:
  octopus-dev:
    profiles:
      - dev
    image: mumu-140/octopus-concurrency:v0.10.1-mumu.1
    pull_policy: never
    container_name: octopus-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - "./data-dev:/app/data"
    environment:
      OCTOPUS_SERVER_HOST: 0.0.0.0
      OCTOPUS_SERVER_PORT: "8080"
